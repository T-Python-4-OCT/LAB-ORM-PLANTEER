{% extends "main/base.html" %}

{% block content %}
<h1>Messages from Users</h1>

<div class="m-grid">
  {% for m in contacts %}
    <div class="m-card">
      <svg class="m-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="10" r="3"/>
        <path d="M6.2 18.5c1.2-2.3 3.4-3.5 5.8-3.5s4.6 1.2 5.8 3.5"/>
      </svg>
      <h3>{{ m.first_name }} {{ m.last_name }}</h3>
      <a class="m-email" href="mailto:{{ m.email }}">{{ m.email }}</a>
      <p>{{ m.message }}</p>
    </div>
  {% empty %}
    <p>No messages yet.</p>
  {% endfor %}
</div>
{% endblock %}
