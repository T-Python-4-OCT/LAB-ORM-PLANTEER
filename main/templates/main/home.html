{% extends 'base.html' %}
{% block content %}
<section class="hero">
    <h1>Planteer – Plant Database For Plants Lovers</h1>
    <form class="search-form" action="{% url 'plants:search_plants' %}" method="get">
        <input type="text" name="q" placeholder="Search plants by name">
        <button class="btn btn-dark" type="submit">Search</button>
    </form>
</section>
<section>
    <div class="section-head">
        <div>
            <h2>Plants</h2>
            <p class="muted">Learn more about plants</p>
        </div>
        <a class="more" href="{% url 'plants:all_plants' %}">More →</a>
    </div>
    <div class="grid">
        {% for plant in plants %}
            {% include 'plants/_card.html' %}
        {% empty %}
            <p class="muted">No plants yet.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
