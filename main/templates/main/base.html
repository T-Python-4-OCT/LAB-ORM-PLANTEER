{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planteer{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="{% url 'main:home_view' %}" class="logo">🌿 Planteer</a>

            <nav class="nav-links">
                <a href="{% url 'plants:all_plants_view' %}">All Plants</a>
                <a href="{% url 'contact:contact_view' %}">Contact Us</a>                
                <a href="{% url 'plants:add_plant_view' %}" class="btn">Add Plant</a>
            </nav>
        </div>
    </header>
    <main class="container page">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <a href="{% url 'main:home_view' %}" class="logo">🌿 Planteer</a>
                <p>Plant database for plant lovers.</p>
                <div class="social">
                    <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>

            <div class="footer-col">
                <h4>Explore</h4>
                <a href="{% url 'plants:all_plants_view' %}">All Plants</a>
                <a href="{% url 'plants:search_view' %}">Search</a>
                <a href="{% url 'plants:add_plant_view' %}">Add Plant</a>
            </div>

            <div class="footer-col">
                <h4>Categories</h4>
                <a href="{% url 'plants:all_plants_view' %}?category=tree">Trees</a>
                <a href="{% url 'plants:all_plants_view' %}?category=fruit">Fruits</a>
                <a href="{% url 'plants:all_plants_view' %}?category=vegetable">Vegetables</a>
            </div>

            <div class="footer-col">
                <h4>About</h4>
                <a href="{% url 'contact:contact_view' %}">Contact Us</a>
                <a href="{% url 'contact:messages_view' %}">Messages</a>
            </div>
        </div>
    </footer>
</body>
</html>
