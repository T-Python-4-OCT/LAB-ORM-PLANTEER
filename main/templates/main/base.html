{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planteer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="site-logo" href="/">Planteer</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="/plants/all/">All Plants</a>
            <a href="/contact/">Contact Us</a>
            <a class="add-plant-link" href="/plants/new/">Add Plant</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>Planteer — Plant Database For Plants Lovers</p>
    </footer>
</body>
</html>
