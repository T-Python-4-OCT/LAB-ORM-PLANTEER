{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planteer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="site-logo" href="/">Planteer</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="/plants/all/">All Plants</a>
            <a href="/contact/">Contact Us</a>
            <a class="add-plant-link" href="/plants/new/">Add Plant</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

   <footer class="site-footer">
    <div class="footer-brand">
        <a href="/">Planteer</a>
        <p>A guide to plants and their uses.</p>

        <div class="footer-social" aria-label="Social media">
            <span>f</span>
            <span>in</span>
            <span>▶</span>
            <span>◎</span>
        </div>
    </div>

    <div class="footer-column">
        <h3>Explore</h3>
        <a href="/plants/all/">All Plants</a>
        <a href="/plants/search/">Search Plants</a>
        <a href="/plants/new/">Add a Plant</a>
    </div>

    <div class="footer-column">
        <h3>Community</h3>
        <a href="/contact/">Contact Us</a>
        <a href="/contact/messages/">Messages</a>
    </div>

    <div class="footer-column">
        <h3>Planteer</h3>
        <a href="/">Home</a>
        <a href="/plants/all/">Plant Collection</a>
    </div>
</footer>
</body>
</html>
