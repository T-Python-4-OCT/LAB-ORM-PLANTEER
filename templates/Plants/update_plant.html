
{% extends 'base.html' %}

{% block title %}Update Plant | Planteer{% endblock %}

{% block content %}

<section class="update-plant-section">
    <div class="update-plant-container">
        <div class="section-heading">
            <span>PLANT MANAGEMENT</span>
            <h1>Update Plant</h1>
            <p>Update the information of your plant.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="plant-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Plant Name</label>
                <input type="text" id="name" name="name"
                       value="{{ plant.name }}" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for value, label in categories %}
                        <option value="{{ value }}"
                            {% if plant.category == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="about">About</label>
                <textarea id="about" name="about" required>{{ plant.about }}</textarea>
            </div>

            <div class="form-group">
                <label for="used_for">Used For</label>
                <textarea id="used_for" name="used_for" required>{{ plant.used_for }}</textarea>
            </div>

            <div class="form-group">
                <label>Current Plant Image</label>
            
                <div class="update-image-preview">
                    <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
                    <span>{{ plant.name }}</span>
                </div>
            </div>

            <div class="form-group">
                <label for="image">Change Image (Optional)</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="is_edible"
                           {% if plant.is_edible %}checked{% endif %}>
                    Is this plant edible?
                </label>
            </div>

            <button type="submit" class="submit-btn">
                Save Changes
            </button>

        </form>
    </div>
</section>

{% endblock %}
