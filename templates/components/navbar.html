
<header class="site-header">
    <nav class="navbar container">

        <a href="{% url 'home' %}" class="site-logo">
            Planteer
        </a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'plant_list' %}">All Plants</a>
            <a href="{% url 'contact' %}">Contact</a>

            {% if user.is_authenticated %}

                <a href="{% url 'profile' %}">My Profile</a>

                <a href="{% url 'plant_create' %}"
                   class="nav-button">
                    Add Plant
                </a>

                {% if user.is_staff %}
                    <a href="{% url 'contact_messages' %}">
                        Messages
                    </a>
                {% endif %}

                <form method="post"
                      action="{% url 'logout' %}"
                      class="logout-form">
                    {% csrf_token %}

                    <button type="submit" class="logout-button">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}">Login</a>

                <a href="{% url 'register' %}"
                   class="nav-button">
                    Sign Up
                </a>

            {% endif %}
        </div>

    </nav>
</header>
