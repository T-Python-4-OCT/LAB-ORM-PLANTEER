{# Renders one form field with its label and errors. Use: {% include "partials/form_field.html" with field=form.name %} #}
<div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}
        <small class="field-error">{{ error }}</small>
    {% endfor %}
</div>
