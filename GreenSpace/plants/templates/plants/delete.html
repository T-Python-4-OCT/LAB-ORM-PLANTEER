
{% extends 'main/base.html' %}

{% block title %}Delete {{ plant.name }} | Planteer{% endblock %}

{% block content %}
<section class="section">
    <div class="container">

        <h1 class="section-title">Delete Plant</h1>

        <div class="card">
            <h2>Are you sure?</h2>

            <p>
                You are about to delete
                <strong>{{ plant.name }}</strong>.
            </p>

            <p class="text-muted">
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-primary">
                    Yes, Delete Plant
                </button>

                <a href="{% url 'plant_detail' plant.id %}"
                   class="btn btn-outline">
                    Cancel
                </a>
            </form>
        </div>

    </div>
</section>
{% endblock %}
