{% extends "main/base.html" %}

{% block title %}{% if plant %}Update {{ plant.name }}{% else %}Add Plant{% endif %} | Planteer{% endblock %}
{% block content %}
<section class="plant-form-page">
    <h1>{% if plant %}Update {{ plant.name }}{% else %}Add a Plant{% endif %}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">{% if plant %}Save Changes{% else %}Add Plant{% endif %}</button>
    </form>

    <a class="back-link" href="/plants/all/">Back to All Plants</a>
</section>
{% endblock %}
