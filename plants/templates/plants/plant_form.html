{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="narrow">
  <h1 class="page-title">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="form" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="field {% if field.field.widget.input_type == 'checkbox' %}field-check{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <div class="actions">
      <button type="submit" class="btn btn-dark">Save</button>
      <a href="{% if plant %}{% url 'plants:plant_detail' plant.id %}{% else %}{% url 'plants:all_plants' %}{% endif %}" class="btn btn-light">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
