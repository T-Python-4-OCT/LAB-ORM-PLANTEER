<a href="{% url 'plants:plant_detail_view' plant.id %}" class="plant-card">
    <div class="plant-card-img">
        <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
    </div>
    <h3>{{ plant.name }}</h3>
    <p class="plant-about">{{ plant.about|truncatewords:8 }}</p>
    <p class="plant-category">{{ plant.get_category_display }}</p>
</a>
