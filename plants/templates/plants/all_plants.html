{% extends "main/base.html" %}

{% block content %}

<h1 class="page-title">All Plants</h1>
<p class="page-sub">Browse every plant in the database</p>

<form class="filter-form" method="get">
  <select name="category">
    <option value="">All Categories</option>
    {% for value, label in categories %}
    <option value="{{ value }}" {% if value == selected_category %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>

  <select name="edible">
    <option value="">Edible & Not Edible</option>
    <option value="yes" {% if selected_edible == "yes" %}selected{% endif %}>Edible</option>
    <option value="no" {% if selected_edible == "no" %}selected{% endif %}>Not Edible</option>
  </select>

  <button type="submit">Filter</button>
  <a href="{% url 'plants:all_plants' %}" class="btn btn-outline">Reset</a>
</form>

<div class="plants-grid">
  {% for plant in plants %}
     <a href="{% url 'plants:plant_detail' plant.id %}" class="card">
     <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
    <h3>{{ plant.name }}</h3>
    <p>{{ plant.about|truncatechars:60 }}</p>
    <span class="cat">{{ plant.get_category_display }}</span>
  </a>
  {% empty %}
  <p>No plants found.</p>
  {% endfor %}
</div>

{% endblock %}
