{% extends "main/base.html" %}
{% load static %}

{% block content %}
<div class="c-grid">
  <div>
    <h1>Update Plant</h1>
    <p class="c-sub">Edit the details of {{ plant.name }}</p>

    <form method="post" enctype="multipart/form-data" class="c-form">
      {% csrf_token %}

      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ plant.name }}" required>

      <label for="about">About</label>
      <textarea id="about" name="about" rows="3" required>{{ plant.about }}</textarea>

      <label for="used_for">Used For</label>
      <textarea id="used_for" name="used_for" rows="3" required>{{ plant.used_for }}</textarea>

      <label for="native_to">Native to</label>
      <input type="text" id="native_to" name="native_to" value="{{ plant.native_to }}">

      <label for="image">Image (leave empty to keep the current one)</label>
      <input type="file" id="image" name="image" accept="image/*">

      <label for="category">Category</label>
      <select id="category" name="category">
        {% for value, label in categories %}
          <option value="{{ value }}" {% if value == plant.category %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>

      <label class="c-check">
        <input type="checkbox" name="is_edible" {% if plant.is_edible %}checked{% endif %}> Edible
      </label>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <img class="c-img" src="{{ plant.image.url }}" alt="{{ plant.name }}">
</div>
{% endblock %}
