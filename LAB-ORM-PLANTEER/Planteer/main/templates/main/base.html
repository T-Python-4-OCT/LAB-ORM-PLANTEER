{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Planteer{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">

</head>

<body>

    <!-- Navbar -->

    <header class="site-header">

        <nav class="nav-inner">

            <a href="{% url 'home' %}" class="brand">

                <i class="bi bi-flower1"></i>

                Planteer<span>.</span>

            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'all_plants' %}">
                    All Plants
                </a>

                <a href="{% url 'contact' %}">
                    Contact Us
                </a>

                <a href="{% url 'contact_messages' %}">
                    Messages
                </a>

                <form method="GET"
                      action="{% url 'search_plant' %}"
                      class="nav-search">

                    <input type="search"
                           name="search"
                           placeholder="Search plants..."
                           aria-label="Search plants"
                           value="{{ search|default:'' }}"
                           required>

                    <button type="submit" aria-label="Search">
                        <i class="bi bi-search"></i>
                    </button>

                </form>

                <a href="{% url 'add_plant' %}" class="add-btn">
                    <i class="bi bi-plus-lg"></i>
                    Add Plant
                </a>

            </div>

        </nav>

    </header>


    <!-- Page Content -->

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <div class="footer-inner">

            <div>

                <h3>
                    <i class="bi bi-flower1"></i>
                    Planteer.
                </h3>

                <p>Discover nature. Grow your knowledge.</p>

            </div>

            <p>© 2026 Planteer. All rights reserved.</p>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
