<a href="{% url 'plants:plant_detail_view' plant.id %}" class="plant-card">
    <div class="plant-card-media">
        <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
    </div>
    <h3 class="plant-card-name">{{ plant.name }}</h3>
    <p class="plant-card-about" dir="auto">{{ plant.about|truncatewords:10 }}</p>
    <p class="plant-card-category">{{ plant.get_category_display }}</p>
</a>
