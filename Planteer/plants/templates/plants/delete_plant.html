{% extends "main/base.html" %}

{% block title %}Delete {{ plant.name }} | Planteer{% endblock %}

{% block content %}
<section class="section delete-section">
    <h1>Delete Plant</h1>

    <div class="delete-card">
        <img src="{{ plant.image.url }}" alt="{{ plant.name }}">

        <h2>{{ plant.name }}</h2>

        <p>Are you sure you want to delete this plant?</p>
        <p>This action will also delete its comments.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'plant_detail' plant.id %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
