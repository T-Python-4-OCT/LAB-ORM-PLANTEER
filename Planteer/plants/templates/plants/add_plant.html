
{% extends 'main/base.html' %}

{% block title %}Add Plant | Planteer{% endblock %}

{% block content %}
<section class="plants-section">
    <h1>Add New Plant</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Plant
        </button>
    </form>
</section>
{% endblock %}
