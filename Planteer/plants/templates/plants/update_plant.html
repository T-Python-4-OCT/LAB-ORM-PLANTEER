
{% extends 'main/base.html' %}

{% block title %}Update {{ plant.name }} | Planteer{% endblock %}

{% block content %}
<section class="plants-section">
    <h1>Update {{ plant.name }}</h1>

    <form method="POST" enctype="multipart/form-data" class="plant-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">Save Changes</button>
        <a href="{% url 'plant_detail' plant.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</section>
{% endblock %}
