
{% extends 'main/base.html' %}

{% block title %}All Plants | Planteer{% endblock %}

{% block content %}

<section class="plants-section">

    <h1>All Plants</h1>

    <form method="GET" class="filters">

        <select name="category">
            <option value="">All Categories</option>
            {% for value, label in categories %}
                <option value="{{ value }}"
                    {% if selected_category == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>

        <select name="is_edible">
            <option value="">All Plants</option>
            <option value="true"
                {% if selected_edible == 'true' %}selected{% endif %}>
                Edible
            </option>
            <option value="false"
                {% if selected_edible == 'false' %}selected{% endif %}>
                Not Edible
            </option>
        </select>

        <button type="submit" class="btn">Filter</button>

    </form>

    <div class="plants-grid">

        {% for plant in plants %}

        <a href="/plants/{{ plant.id }}/detail/" class="plant-card">
            <img src="{{ plant.image.url }}" alt="{{ plant.name }}">
            <h3>{{ plant.name }}</h3>
            <p>{{ plant.about|truncatewords:8 }}</p>
            <span>{{ plant.get_category_display }}</span>
        </a>

        {% empty %}
        <p>No plants found.</p>
        {% endfor %}

    </div>

</section>

{% endblock %}
