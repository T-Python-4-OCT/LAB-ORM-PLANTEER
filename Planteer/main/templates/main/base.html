{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planteer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'main:home_view' %}" class="logo">
                <svg viewBox="5 2 22.5 27.5" fill="currentColor" aria-hidden="true">
                    <path d="M16.4 13.2c-1.6-3.4-5.6-5.2-10.8-4.2 3.9.8 6.8 2.6 8.8 5z"/>
                    <path d="M16.6 13.2c1.4-3.6 5.4-5.6 10.6-4.8-3.9.6-6.9 2.2-9.1 4.8z"/>
                    <path d="M16.2 13.6c-3.8-.6-7.6 1-10.2 4.8 2.6-1.7 5.4-2.6 8.6-2.9z"/>
                    <path d="M16.8 13.6c3.8-.4 7.4 1.6 9.4 5.6-2.4-2-5.3-3.1-8.4-3.4z"/>
                    <path d="M16.4 13.1c.2-4.2 2.2-7.8 6-10.4-2.2 2.6-3.4 5.8-3.8 9.2z"/>
                    <path d="M16.5 13.1c-.6-3.8-2.6-6.8-6-8.8 2.2 2.4 3.4 5.4 3.8 8.8z"/>
                    <path d="M15.6 13.8h2c-1.2 4.6-1.8 9.2-1.9 14.2h-2c.1-5 .7-9.6 1.9-14.2z"/>
                    <circle cx="14.2" cy="15.6" r="1.1"/>
                    <circle cx="18.8" cy="15.4" r="1.1"/>
                    <circle cx="16.4" cy="16.4" r="1"/>
                    <rect x="10.5" y="27.6" width="11" height="1.6" rx=".8"/>
                </svg>
                Planteer
            </a>

            <nav class="nav-links">
                <a href="{% url 'plants:all_plants_view' %}" class="nav-link {% if request.resolver_match.url_name == 'all_plants_view' %}active{% endif %}">All Plants</a>
                <a href="{% url 'main:contact_view' %}" class="nav-link {% if request.resolver_match.url_name == 'contact_view' %}active{% endif %}">Contact Us</a>
                <a href="{% url 'plants:add_plant_view' %}" class="btn btn-small">Add Plant</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="container site-footer">
        <div class="footer-brand">
            <a href="{% url 'main:home_view' %}" class="footer-logo">Planteer</a>
            <div class="footer-icons">
                <a href="{% url 'main:home_view' %}" aria-label="Home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 10.5 12 3l9 7.5"/>
                        <path d="M5 9.5V21h14V9.5"/>
                    </svg>
                </a>
                <a href="{% url 'plants:all_plants_view' %}" aria-label="All plants">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/>
                        <path d="M5 19 13 11"/>
                    </svg>
                </a>
                <a href="{% url 'plants:search_view' %}" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="m20 20-4-4"/>
                    </svg>
                </a>
                <a href="{% url 'main:contact_view' %}" aria-label="Contact us">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3.5 6 8.5 7 8.5-7"/>
                    </svg>
                </a>
            </div>
        </div>

        <nav class="footer-links" aria-label="Footer">
            <div>
                <h3>Explore</h3>
                <a href="{% url 'plants:all_plants_view' %}">All plants</a>
                <a href="{% url 'plants:search_view' %}">Search</a>
                <a href="{% url 'plants:add_plant_view' %}">Add a plant</a>
            </div>
            <div>
                <h3>Categories</h3>
                <a href="{% url 'plants:all_plants_view' %}?category=tree">Trees</a>
                <a href="{% url 'plants:all_plants_view' %}?category=fruit">Fruits</a>
                <a href="{% url 'plants:all_plants_view' %}?category=herb">Herbs</a>
            </div>
            <div>
                <h3>Planteer</h3>
                <a href="{% url 'main:contact_view' %}">Contact us</a>
                <a href="{% url 'main:contact_messages_view' %}">Messages</a>
                <a href="{% url 'main:home_view' %}">Home</a>
            </div>
        </nav>
    </footer>

</body>
</html>
