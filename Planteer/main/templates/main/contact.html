{% extends "main/base.html" %}
{% load static %}

{% block title %}Planteer | Contact Us{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">
{% endblock %}

{% block content %}
<section class="contact-layout">
    <div class="contact-form">
        <h1>Contact us</h1>
        <p class="muted">Have a question or suggestion? Send us a message.</p>

        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div>
                    <label>First name</label>
                    <input type="text" name="first_name" placeholder="Saad" required>
                </div>
                <div>
                    <label>Last name</label>
                    <input type="text" name="last_name" placeholder="Almutairi" required>
                </div>
            </div>

            <label>Email address</label>
            <input type="email" name="email" placeholder="email@janesfakedomain.net" required>

            <label>Your message</label>
            <textarea name="message" rows="5" placeholder="Enter your question or message" required></textarea>

            <button type="submit" class="btn submit-btn">Submit</button>
        </form>
    </div>

    <div class="contact-image">
        <img src="{% static 'images/contact.jpg' %}" alt="Flowers">
    </div>
</section>
{% endblock %}
