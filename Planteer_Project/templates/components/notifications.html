{% if messages %}

    {% for message in messages %}

        <div class="alert alert-dismissible fade show
            {% if message.tags == 'error' %}
                alert-danger
            {% else %}
                alert-{{ message.tags|default:'info' }}
            {% endif %}"
            role="alert">

            {{ message }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>

        </div>

    {% endfor %}

{% endif %}
