{% load static %}

<header class="site-header">

    <nav class="navbar navbar-expand-lg site-container">

        <a class="navbar-brand"
           href="{% url 'main:home' %}"
           aria-label="Planteer Home">

            <img
                src="{% static 'images/logo/planteer-logo-navbar.png' %}"
                alt="Planteer"
                class="navbar-brand-logo"
                width="170"
                height="56"
                decoding="async">

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <i class="bi bi-list"></i>

        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'plants:all_plants' %}">

                        All Plants

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'main:contact' %}">

                        Contact Us

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-main"
                       href="{% url 'plants:manage_plants' %}">

                        Manage Plants

                    </a>

                </li>

                <li class="nav-item">

                    <button id="themeToggle"
                            class="theme-toggle"
                            type="button"
                            aria-label="Toggle dark mode">

                        <i class="bi bi-moon"></i>

                    </button>

                </li>

                <li class="nav-item">

                    <a href="{% url 'plants:search' %}"
                       class="nav-search"
                       aria-label="Search plants"
                       title="Search">

                        <i class="bi bi-search"></i>

                    </a>

                </li>

            </ul>

        </div>

    </nav>

</header>
